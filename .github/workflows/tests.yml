name: Tests

on:
  push:
    branches: [main, sync-local-work]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  phpunit:
    name: PHPUnit (Unit + Feature)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, mysql, zip, gd
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Run PHPUnit
        run: php artisan test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: phpunit

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: aurora_beauty_salon_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: aurora_beauty_salon_ci
      DB_USERNAME: root
      DB_PASSWORD: ""
      MAIL_MAILER: array
      # Required for the booking -> payment E2E test (Group K), which hits the
      # real Midtrans Sandbox. Add these in Settings > Secrets and variables > Actions.
      MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
      MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
      MIDTRANS_IS_PRODUCTION: "false"
      MIDTRANS_IS_SANITIZED: "true"
      MIDTRANS_IS_3DS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, mysql, zip, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Generate app key
        run: php artisan key:generate

      - name: Wait for MySQL and run migrations
        run: |
          for i in $(seq 1 20); do mysqladmin ping -h127.0.0.1 -uroot --silent && break; sleep 2; done
          php artisan migrate --force

      - name: Build frontend assets
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        run: npx playwright test
        env:
          E2E_BROWSER_CHANNEL: chromium

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-report/
          retention-days: 14
